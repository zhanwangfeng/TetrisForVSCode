<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- T 形拼块：顶部三连块 -->
    <rect x="3" y="3"  width="5" height="5" rx="1"/>
    <rect x="9" y="3"  width="5" height="5" rx="1"/>
    <rect x="15" y="3" width="5" height="5" rx="1"/>
    <!-- T 形竖向下块（居中） -->
    <rect x="9" y="9" width="5" height="5" rx="1"/>
    <!-- 左下箭头（指向左） -->
    <polyline points="6,19 2,19 2,15"/>
    <line x1="2" y1="19" x2="8" y2="19"/>
    <!-- 右下箭头（指向右） -->
    <polyline points="18,19 22,19 22,15"/>
    <line x1="16" y1="19" x2="22" y2="19"/>
  </g>
</svg>
