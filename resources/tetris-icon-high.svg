<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆角方块，增强 Activity Bar 入口辨识度 -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="#1e1e1e"/>
  <!-- T 形拼块（经典俄罗斯方块符号）：品字形三块 + 下方一块 -->
  <!-- 顶部三连块 -->
  <g>
    <rect x="5"  y="4" width="4.4" height="4.4" rx="1" fill="#ff3b30"/>
    <rect x="9.8" y="4" width="4.4" height="4.4" rx="1" fill="#ff3b30"/>
    <rect x="14.6" y="4" width="4.4" height="4.4" rx="1" fill="#ff3b30"/>
  </g>
  <!-- T 形竖向下块（居中） -->
  <rect x="9.8" y="8.8" width="4.4" height="4.4" rx="1" fill="#ff3b30"/>
  <!-- L/J 形拼块（左下，青色） -->
  <rect x="5"  y="13.6" width="4.4" height="4.4" rx="1" fill="#34c759"/>
  <rect x="5"  y="18.4" width="4.4" height="3.6" rx="1" fill="#34c759"/>
  <rect x="9.8" y="18.4" width="4.4" height="3.6" rx="1" fill="#34c759"/>
  <!-- 右侧斜置方块（蓝/黄拼块） -->
  <rect x="14.6" y="13.6" width="4.4" height="4.4" rx="1" fill="#ffcc00"/>
  <rect x="14.6" y="18.4" width="4.4" height="3.6" rx="1" fill="#0a84ff"/>
</svg>
